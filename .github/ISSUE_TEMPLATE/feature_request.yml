name: Feature Request
description: Propose a new export target, Agent Skill spec adapter, or studio tool
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow Pain Point
      placeholder: "Describe the documentation or AI skill authoring friction you want solved."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations:
      required: true
