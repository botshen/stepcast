[package]
name = "stepcast"
version = "0.1.0"
description = "StepCast — Local-first workflow recorder for visual SOPs and AI Agent SKILL.md"
authors = ["StepCast Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "stepcast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "abort"
opt-level = 3
